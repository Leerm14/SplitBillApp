# CFG-05: kiểm tra mỗi lần đẩy code / mở PR (DEV giai đoạn 0).
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npx jest --ci

      # BE-13: supabase/functions/_shared phải khớp src/domain (jest cũng kiểm tra)
      - name: Shared domain code in sync
        run: npm run sync:shared:check

      - name: Lint
        run: npx expo lint

  # Backend: áp toàn bộ migration lên Postgres của Supabase local rồi chạy pgTAP
  # (supabase/tests/*.sql). Docker có sẵn trên runner ubuntu.
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 2.121.0

      - name: Start local Supabase (applies supabase/migrations)
        run: supabase start

      - name: pgTAP tests
        run: supabase test db

      - name: Stop Supabase
        if: always()
        run: supabase stop --no-backup

  # Edge Functions: kiểm tra kiểu bằng Deno (không phải tsc của app).
  edge-functions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.8

      - name: Deno typecheck
        run: deno check supabase/functions/*/index.ts
